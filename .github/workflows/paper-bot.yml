name: EdgeRoom Paper Bot

# Runs the free cloud paper bot from GitHub Actions.

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  run-paper-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run cloud paper bot
        run: node scripts/cloud-paper-bot.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
